name: agent_m4_close_only

on:
  pull_request:
    branches:
      - m4-dac_trung-xep-hang-hoc_may-sach-final-v2
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  tao_commit_close_only:
    if: github.head_ref == 'agent/m4-benchmark-close-only-staging'
    runs-on: ubuntu-24.04
    steps:
      - name: Lay patch harness
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: patch-source
          fetch-depth: 1

      - name: Lay canonical head
        uses: actions/checkout@v4
        with:
          ref: m4-dac_trung-xep-hang-hoc_may-sach-final-v2
          path: worktree
          fetch-depth: 0

      - name: Cai dat uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"

      - name: Cai dat Python
        run: uv python install 3.12

      - name: Khoa parent canonical
        working-directory: worktree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "e2c866db1fdb0b143a94a53a4ec26ee8b1e2c81e"
          test -z "$(git status --short)"

      - name: Ap dung patch close-only
        shell: bash
        run: |
          set -euo pipefail
          python patch-source/tools/agent_patch_m4_close_only.py worktree

      - name: Kiem tra lock va dong bo
        working-directory: worktree
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- uv.lock
          uv lock --check
          uv sync --frozen --python 3.12

      - name: Ghi nhan phien ban
        working-directory: worktree
        shell: bash
        run: |
          set -euo pipefail
          {
            uv --version
            uv run --python 3.12 python --version
            uv run --python 3.12 python -c "import sklearn; print('scikit-learn', sklearn.__version__)"
          } | tee "$RUNNER_TEMP/m4-benchmark-close-only-versions.txt"

      - name: Compileall
        working-directory: worktree
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          uv run --python 3.12 python -m compileall -q src tests

      - name: Chay toan bo unittest
        working-directory: worktree
        shell: bash
        env:
          PYTHONPATH: src
          NO_PROXY: "*"
        run: |
          set -euo pipefail
          uv run --python 3.12 python -m unittest discover -s tests -p 'test_*.py' -v \
            2>&1 | tee "$RUNNER_TEMP/m4-benchmark-close-only-tests.log"
          grep -E '^Ran [0-9]+ tests? in ' "$RUNNER_TEMP/m4-benchmark-close-only-tests.log"
          test "$(sed -nE 's/^Ran ([0-9]+) tests? in .*/\1/p' "$RUNNER_TEMP/m4-benchmark-close-only-tests.log" | tail -1)" -ge 320

      - name: Kiem tra diff va tao dung mot commit
        working-directory: worktree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- uv.lock
          git config user.name "Tienkhoaa2908"
          git config user.email "236086801+Tienkhoaa2908@users.noreply.github.com"
          git add \
            src/he_thong_dinh_luong/nghien_cuu_moc_4 \
            tests/ho_tro_m4_runner.py \
            tests/test_m4_benchmark_close_only.py \
            DECISIONS.md \
            README.md \
            tai_lieu/dac_ta_moc_4.md \
            tai_lieu/kien_truc_moc_4.md \
            tai_lieu_dieu_phoi
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "tach hop dong benchmark chi dung gia dong cua Moc 4"
          test "$(git rev-list --count e2c866db1fdb0b143a94a53a4ec26ee8b1e2c81e..HEAD)" = "1"
          git show --stat --oneline --decorate HEAD
          git rev-parse HEAD | tee "$RUNNER_TEMP/m4-benchmark-close-only-result-sha.txt"

      - name: Cong bo commit len nhanh result tam
        working-directory: worktree
        shell: bash
        env:
          RESULT_BRANCH: agent/m4-benchmark-close-only-result-v1
        run: |
          set -euo pipefail
          if git ls-remote --exit-code origin "refs/heads/$RESULT_BRANCH" >/dev/null 2>&1; then
            echo "Result branch already exists: $RESULT_BRANCH" >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/$RESULT_BRANCH"

      - name: Tai bang chung local test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-benchmark-close-only-local-proof
          path: |
            ${{ runner.temp }}/m4-benchmark-close-only-tests.log
            ${{ runner.temp }}/m4-benchmark-close-only-versions.txt
            ${{ runner.temp }}/m4-benchmark-close-only-result-sha.txt
          if-no-files-found: warn
