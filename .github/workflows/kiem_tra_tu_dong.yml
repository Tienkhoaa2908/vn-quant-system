name: kiem_tra_tu_dong

on:
  push:
    branches:
      - main
      - m4-dac_trung-xep_hang-hoc_may
      - m4-dac_trung-xep-hang-hoc_may-sach-v2
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cap_nhat_lock:
    if: github.event_name == 'push' && github.ref == 'refs/heads/m4-dac_trung-xep-hang-hoc_may-sach-v2'
    runs-on: ubuntu-24.04
    steps:
      - name: Lay nhanh can cap nhat
        uses: actions/checkout@v4
        with:
          ref: m4-dac_trung-xep-hang-hoc_may-sach-v2
          fetch-depth: 0
      - name: Cai dat uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - name: Cai dat Python
        run: uv python install 3.12
      - name: Tai tao va commit uv.lock
        shell: bash
        run: |
          uv lock --python 3.12
          if git diff --quiet -- uv.lock; then
            echo "uv.lock da dung; khong tao commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "cap nhat uv lock da nen tang do uv 0.11.32 sinh ra"
          git push origin HEAD:m4-dac_trung-xep-hang-hoc_may-sach-v2

  kiem_tra:
    name: kiem_tra_${{ matrix.he_dieu_hanh }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - he_dieu_hanh: ubuntu
            runner: ubuntu-24.04
          - he_dieu_hanh: windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4
      - name: Cai dat uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - name: Cai dat Python
        run: uv python install 3.12
      - name: Tai tao khoa dependency bang uv
        run: uv lock --python 3.12
      - name: Dong bo moi truong
        run: uv sync --frozen --python 3.12
      - name: Ghi nhan phien ban
        run: |
          {
            uv --version
            uv run --python 3.12 python --version
            uv run --python 3.12 python -c "import sklearn; print('scikit-learn', sklearn.__version__)"
          } | tee "phien-ban-ci-${{ matrix.he_dieu_hanh }}.txt"
      - name: Kiem tra cu phap
        env:
          PYTHONPATH: src
        run: uv run --python 3.12 python -m compileall -q src tests
      - name: Chay kiem thu ngoai tuyen
        env:
          PYTHONPATH: src
          NO_PROXY: "*"
        run: uv run --python 3.12 python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Tai thong tin phien ban
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phien-ban-ci-${{ matrix.he_dieu_hanh }}
          path: phien-ban-ci-${{ matrix.he_dieu_hanh }}.txt
          if-no-files-found: error
      - name: Xac nhan lock trong repository da duoc cap nhat
        run: git diff --exit-code -- uv.lock
