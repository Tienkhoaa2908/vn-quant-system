name: kiem_tra_tu_dong

on:
  push:
    branches: [main, m4-dac_trung-xep_hang-hoc_may]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  kiem_tra:
    runs-on: ubuntu-latest
    steps:
      - name: Phan tich block tar payload Moc 4
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 10
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import urllib.request
          import zlib

          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/issues/10/comments?per_page=100",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              comments = json.load(response)
          pieces = {}
          for item in comments:
              body = item.get("body") or ""
              if body.startswith("M4PAYLOAD ") and "\n" in body:
                  marker, payload = body.split("\n", 1)
                  pieces[marker.split()[1].split("/", 1)[0]] = payload.strip()
          required = [f"{index:02d}" for index in range(10)] + ["10A", "10B", "11"]
          encoded = "".join(pieces[key] for key in required)
          raw = base64.b64decode(encoded + "=" * (-len(encoded) % 4), validate=True)
          tar_bytes = zlib.decompress(raw[10:-8], -zlib.MAX_WBITS)
          report = {
              "tar_length": len(tar_bytes),
              "tar_mod_512": len(tar_bytes) % 512,
              "tar_sha256": hashlib.sha256(tar_bytes).hexdigest(),
              "members": [],
          }
          offset = 0
          while offset + 512 <= len(tar_bytes):
              header = tar_bytes[offset:offset + 512]
              if not any(header):
                  report["zero_block_at"] = offset
                  break
              name = header[:100].split(b"\0", 1)[0].decode("utf-8", "replace")
              prefix = header[345:500].split(b"\0", 1)[0].decode("utf-8", "replace")
              if prefix:
                  name = prefix + "/" + name
              raw_size = header[124:136].split(b"\0", 1)[0].strip() or b"0"
              try:
                  size = int(raw_size, 8)
              except ValueError:
                  report["header_error"] = {"offset": offset, "name": name, "raw_size": raw_size.decode("ascii", "replace")}
                  break
              data_start = offset + 512
              data_end = data_start + size
              padded_end = data_start + ((size + 511) // 512) * 512
              complete = data_end <= len(tar_bytes)
              content = tar_bytes[data_start:min(data_end, len(tar_bytes))]
              report["members"].append({
                  "name": name,
                  "size": size,
                  "offset": offset,
                  "data_end": data_end,
                  "padded_end": padded_end,
                  "complete": complete,
                  "available": len(content),
                  "sha256": hashlib.sha256(content).hexdigest(),
              })
              if not complete:
                  report["truncated_member"] = name
                  break
              offset = padded_end
          report["parsed_until"] = offset
          report["remaining_bytes"] = len(tar_bytes) - offset
          print("M4_TAR_BLOCK_REPORT=" + json.dumps(report, ensure_ascii=True, sort_keys=True))
          raise SystemExit(1)
          PY
