name: kiem_tra_tu_dong

on:
  push:
    branches: [main, m4-dac_trung-xep_hang-hoc_may]
  pull_request:
  workflow_dispatch:

jobs:
  kiem_tra:
    runs-on: ubuntu-latest
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4
      - name: Cai dat uv
        uses: astral-sh/setup-uv@v6
      - name: Cai dat Python
        run: uv python install 3.12
      - name: Dong bo moi truong
        run: uv sync --frozen --python 3.12
      - name: Ghi nhan phien ban
        run: |
          uv --version
          uv run --python 3.12 python --version
          uv run --python 3.12 python -c "import sklearn; print('scikit-learn', sklearn.__version__)"
      - name: Kiem tra cu phap
        run: PYTHONPATH=src uv run --python 3.12 python -m compileall -q src tests
      - name: Chay kiem thu ngoai tuyen
        env:
          NO_PROXY: "*"
        run: PYTHONPATH=src uv run --python 3.12 python -m unittest discover -s tests -p 'test_*.py' -v
