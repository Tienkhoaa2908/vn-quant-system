name: kiem_tra_tu_dong

on:
  push:
    branches: [main, m4-dac_trung-xep_hang-hoc_may]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  kiem_tra:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 10
    runs-on: ubuntu-latest
    steps:
      - name: Chan doan chunk trang 2
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import urllib.request

          expected = {
              "00": (8000, "e9d62e89c0f9ff918cef2a49f24e326edaed30a9f2ddaa2bf0649f18c5934045"),
              "01": (8000, "cd3120c436e94686c1747dbd3120125559c5aa4fae325c604240b61b4ebf3038"),
              "02": (8000, "00494ef24ff39f4735b6daf724fa2939e5a14195961b2ee9163498a6a5d50498"),
              "03": (8000, "006742c04e4fea0d9a4c2ff431883d2308dec8bc09d67811111c6ce1cf4beab9"),
              "04": (8000, "02698dbce6bb4936cbafdef0d0caff261d7e760353f45e4996504662b7c74135"),
              "05": (8000, "98fc8e470f13cd41f84339d0d3547170679770221d0e61e109f41e4840611c28"),
              "06": (8000, "7a8748a96200d7a9720e248af40fa43dc3f710424eab5e8faf29b877d4336e54"),
              "07": (8000, "8c2f0158dd2fdfb78d0f712e50b3c7815cc1f01a0c2f769a3ca72147ad1d4996"),
              "08": (6132, "a146943a5133ee8caa7d68a728aef4e4954d28b6ccc99ffcc425c45500f7f2e7"),
          }
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/issues/10/comments?per_page=100&page=2",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              comments = json.load(response)
          print(f"PAGE2 count={len(comments)}")
          pieces = {}
          for item in comments:
              body = item.get("body") or ""
              if body.startswith("M4FINAL3 ") and "\n" in body:
                  marker, payload = body.split("\n", 1)
                  fields = marker.split()
                  print(f"MARKER id={item['id']} fields={fields}")
                  if len(fields) == 4:
                      index, total = fields[1].split("/", 1)
                      if total == "09" and index in expected:
                          pieces[index] = payload.strip()
          for index in sorted(expected):
              payload = pieces.get(index, "")
              actual_hash = hashlib.sha256(payload.encode("ascii")).hexdigest()
              expected_length, expected_hash = expected[index]
              print(f"CHUNK {index} length={len(payload)}/{expected_length} sha={actual_hash} expected={expected_hash} ok={len(payload)==expected_length and actual_hash==expected_hash}")
          raise SystemExit(1)
          PY
