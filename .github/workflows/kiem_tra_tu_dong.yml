name: kiem_tra_tu_dong

on:
  push:
    branches: [main, m4-dac_trung-xep_hang-hoc_may]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  kiem_tra:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 10
    runs-on: ubuntu-latest
    steps:
      - name: Lay nhanh chuyen mon
        uses: actions/checkout@v4
        with:
          ref: m4-dac_trung-xep_hang-hoc_may
          fetch-depth: 0

      - name: Cai dat uv
        uses: astral-sh/setup-uv@v6

      - name: Cai dat Python
        run: uv python install 3.12

      - name: Xac minh va ap dung payload
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import tarfile
          import urllib.request

          expected = {
              "00": (8000, "e9d62e89c0f9ff918cef2a49f24e326edaed30a9f2ddaa2bf0649f18c5934045"),
              "01": (8000, "cd3120c436e94686c1747dbd3120125559c5aa4fae325c604240b61b4ebf3038"),
              "02": (8000, "00494ef24ff39f4735b6daf724fa2939e5a14195961b2ee9163498a6a5d50498"),
              "03": (8000, "006742c04e4fea0d9a4c2ff431883d2308dec8bc09d67811111c6ce1cf4beab9"),
              "04": (8000, "02698dbce6bb4936cbafdef0d0caff261d7e760353f45e4996504662b7c74135"),
              "05": (8000, "98fc8e470f13cd41f84339d0d3547170679770221d0e61e109f41e4840611c28"),
              "06": (8000, "7a8748a96200d7a9720e248af40fa43dc3f710424eab5e8faf29b877d4336e54"),
              "07": (8000, "8c2f0158dd2fdfb78d0f712e50b3c7815cc1f01a0c2f769a3ca72147ad1d4996"),
              "08": (6132, "a146943a5133ee8caa7d68a728aef4e4954d28b6ccc99ffcc425c45500f7f2e7"),
          }
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/issues/10/comments?per_page=100",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              comments = json.load(response)
          pieces: dict[str, tuple[int, str]] = {}
          for item in comments:
              body = item.get("body") or ""
              if not body.startswith("M4FINAL3 ") or "\n" not in body:
                  continue
              marker, payload = body.split("\n", 1)
              fields = marker.split()
              if len(fields) != 4:
                  continue
              index, total = fields[1].split("/", 1)
              if total != "09" or index not in expected:
                  continue
              pieces[index] = (int(item["id"]), payload.strip())
          missing = sorted(set(expected) - set(pieces))
          if missing:
              raise SystemExit(f"Thieu chunk M4FINAL3: {missing}")
          ordered = []
          for index in sorted(expected):
              payload = pieces[index][1]
              expected_length, expected_hash = expected[index]
              actual_hash = hashlib.sha256(payload.encode("ascii")).hexdigest()
              if len(payload) != expected_length:
                  raise SystemExit(f"Sai do dai chunk {index}: {len(payload)} != {expected_length}")
              if actual_hash != expected_hash:
                  raise SystemExit(f"Sai SHA chunk {index}: {actual_hash}")
              ordered.append(payload)
          archive_bytes = base64.b64decode("".join(ordered), validate=True)
          archive_hash = hashlib.sha256(archive_bytes).hexdigest()
          if len(archive_bytes) != 52597:
              raise SystemExit(f"Sai kich thuoc archive: {len(archive_bytes)}")
          if archive_hash != "a44887597d53f5fa784cf828b0c69f4494c1a5ed447d97d0d8d10bf4674bfa6b":
              raise SystemExit(f"Sai SHA archive: {archive_hash}")
          archive_path = Path("/tmp/m4final.tar.gz")
          archive_path.write_bytes(archive_bytes)
          root = Path.cwd().resolve()
          with tarfile.open(archive_path, "r:gz") as archive:
              for member in archive.getmembers():
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Duong dan archive khong an toan: {member.name}")
                  destination = (root / Path(*path.parts)).resolve()
                  if destination != root and root not in destination.parents:
                      raise SystemExit(f"Archive thoat khoi repository: {member.name}")
              archive.extractall(root, filter="data")
          deletions_path = root / ".m4_deletions.json"
          deletions = json.loads(deletions_path.read_text(encoding="utf-8"))
          for relative in deletions:
              target = (root / relative).resolve()
              if target != root and root not in target.parents:
                  raise SystemExit(f"Duong dan xoa khong an toan: {relative}")
              if target.exists():
                  target.unlink()
          deletions_path.unlink()
          PY

      - name: Dong bo moi truong
        run: uv sync --frozen --python 3.12

      - name: Kiem tra cu phap
        run: PYTHONPATH=src uv run --python 3.12 python -m compileall -q src tests

      - name: Chay kiem thu ngoai tuyen
        env:
          NO_PROXY: "*"
        run: PYTHONPATH=src uv run --python 3.12 python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Commit va push fast-forward
        run: |
          git fetch origin m4-dac_trung-xep_hang-hoc_may
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/m4-dac_trung-xep_hang-hoc_may)"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "hoan thien pipeline dau cuoi Moc 4"
          git push origin HEAD:m4-dac_trung-xep_hang-hoc_may
