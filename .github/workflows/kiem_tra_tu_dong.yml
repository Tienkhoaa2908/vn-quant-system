name: kiem_tra_tu_dong

on:
  push:
    branches: [main, m4-dac_trung-xep_hang-hoc_may]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  kiem_tra:
    runs-on: ubuntu-latest
    steps:
      - name: Phuc hoi phan payload Moc 4
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 10
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path, PurePosixPath
          import urllib.request
          import zlib

          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/issues/10/comments?per_page=100",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              comments = json.load(response)
          pieces = {}
          for item in comments:
              body = item.get("body") or ""
              if body.startswith("M4PAYLOAD ") and "\n" in body:
                  marker, payload = body.split("\n", 1)
                  pieces[marker.split()[1].split("/", 1)[0]] = payload.strip()
          required = [f"{index:02d}" for index in range(10)] + ["10A", "10B", "11"]
          encoded = "".join(pieces[key] for key in required)
          raw = base64.b64decode(encoded + "=" * (-len(encoded) % 4), validate=True)
          tar_bytes = zlib.decompress(raw[10:-8], -zlib.MAX_WBITS)
          root = Path("/tmp/m4_recovered")
          root.mkdir(parents=True, exist_ok=True)
          report = []
          offset = 0
          while offset + 512 <= len(tar_bytes):
              header = tar_bytes[offset:offset + 512]
              if not any(header):
                  break
              name = header[:100].split(b"\0", 1)[0].decode("utf-8", "strict")
              prefix = header[345:500].split(b"\0", 1)[0].decode("utf-8", "strict")
              if prefix:
                  name = prefix + "/" + name
              path = PurePosixPath(name)
              if path.is_absolute() or ".." in path.parts:
                  raise SystemExit(f"Duong dan khong an toan: {name}")
              size = int((header[124:136].split(b"\0", 1)[0].strip() or b"0"), 8)
              data_start = offset + 512
              data_end = data_start + size
              padded_end = data_start + ((size + 511) // 512) * 512
              available = max(0, min(size, len(tar_bytes) - data_start))
              content = tar_bytes[data_start:data_start + available]
              destination = root / Path(*path.parts)
              destination.parent.mkdir(parents=True, exist_ok=True)
              if data_end <= len(tar_bytes):
                  destination.write_bytes(content)
                  report.append({"name": name, "size": size, "complete": True})
              else:
                  destination.with_suffix(destination.suffix + ".partial").write_bytes(content)
                  report.append({"name": name, "size": size, "available": available, "complete": False})
                  break
              offset = padded_end
          (root / "recovery_report.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
          PY
      - name: Tai artifact phuc hoi
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 10
        uses: actions/upload-artifact@v4
        with:
          name: m4-recovered-payload
          path: /tmp/m4_recovered
          if-no-files-found: error
