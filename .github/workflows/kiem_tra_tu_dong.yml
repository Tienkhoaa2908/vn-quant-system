name: kiem_tra_tu_dong

on:
  push:
    branches: [main, m4-dac_trung-xep_hang-hoc_may]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  kiem_tra:
    runs-on: ubuntu-latest
    steps:
      - name: Bao cao raw deflate payload Moc 4
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 10
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import os
          from pathlib import PurePosixPath
          import tarfile
          import urllib.request
          import zlib

          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/issues/10/comments?per_page=100",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              comments = json.load(response)
          pieces = {}
          for item in comments:
              body = item.get("body") or ""
              if body.startswith("M4PAYLOAD ") and "\n" in body:
                  marker, payload = body.split("\n", 1)
                  pieces[marker.split()[1].split("/", 1)[0]] = payload.strip()
          required = [f"{index:02d}" for index in range(10)] + ["10A", "10B", "11"]
          encoded = "".join(pieces[key] for key in required)
          raw = base64.b64decode(encoded + "=" * (-len(encoded) % 4), validate=True)
          report = {
              "encoded_length": len(encoded),
              "raw_length": len(raw),
              "raw_sha256": hashlib.sha256(raw).hexdigest(),
              "header_hex": raw[:10].hex(),
              "footer_hex": raw[-8:].hex(),
          }
          try:
              tar_bytes = zlib.decompress(raw[10:-8], -zlib.MAX_WBITS)
              report["tar_length"] = len(tar_bytes)
              report["tar_sha256"] = hashlib.sha256(tar_bytes).hexdigest()
              members = []
              with tarfile.open(fileobj=io.BytesIO(tar_bytes), mode="r:") as archive:
                  for member in archive.getmembers():
                      path = PurePosixPath(member.name)
                      safe = not path.is_absolute() and ".." not in path.parts
                      extracted = archive.extractfile(member) if member.isfile() else None
                      content = extracted.read() if extracted is not None else b""
                      members.append({
                          "name": member.name,
                          "size": member.size,
                          "safe": safe,
                          "sha256": hashlib.sha256(content).hexdigest() if member.isfile() else None,
                      })
              report["members"] = members
              report["tar_valid"] = all(item["safe"] for item in members)
          except Exception as exc:
              report["tar_valid"] = False
              report["error_type"] = type(exc).__name__
              report["error"] = str(exc)
          print("M4_RAW_DEFLATE_REPORT=" + json.dumps(report, ensure_ascii=True, sort_keys=True))
          raise SystemExit(1)
          PY
