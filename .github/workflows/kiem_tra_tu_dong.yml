name: kiem_tra_tu_dong

on:
  push:
    branches: [main, m4-dac_trung-xep_hang-hoc_may]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  kiem_tra:
    runs-on: ubuntu-latest
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4
      - name: Bao cao payload Moc 4
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 10
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import tarfile
          import urllib.request

          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/issues/10/comments?per_page=100",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              comments = json.load(response)
          pieces = {}
          for item in comments:
              body = item.get("body") or ""
              if body.startswith("M4PAYLOAD ") and "\n" in body:
                  marker, payload = body.split("\n", 1)
                  pieces[marker.split()[1].split("/", 1)[0]] = payload.strip()
          required = [f"{index:02d}" for index in range(10)] + ["10A", "10B", "11"]
          encoded_raw = "".join(pieces[key] for key in required)
          padding = "=" * (-len(encoded_raw) % 4)
          report = {
              "keys": sorted(pieces),
              "lengths": {key: len(pieces[key]) for key in required},
              "encoded_length": len(encoded_raw),
              "mod4": len(encoded_raw) % 4,
              "padding_added": len(padding),
          }
          try:
              raw = base64.b64decode(encoded_raw + padding, validate=True)
              report["raw_length"] = len(raw)
              report["sha256"] = hashlib.sha256(raw).hexdigest()
              report["magic_hex"] = raw[:16].hex()
              path = Path("/tmp/m4_payload.tar.gz")
              path.write_bytes(raw)
              with tarfile.open(path, "r:gz") as archive:
                  report["members"] = [member.name for member in archive.getmembers()]
              report["archive_valid"] = True
          except Exception as exc:
              report["archive_valid"] = False
              report["error_type"] = type(exc).__name__
              report["error"] = str(exc)
          print("M4_PAYLOAD_REPORT=" + json.dumps(report, ensure_ascii=True, sort_keys=True))
          raise SystemExit(1)
          PY
      - name: Cai dat uv
        uses: astral-sh/setup-uv@v6
      - name: Cai dat Python
        run: uv python install 3.12
      - name: Dong bo moi truong
        run: uv sync --frozen --python 3.12
      - name: Kiem tra cu phap
        run: PYTHONPATH=src uv run --python 3.12 python -m compileall -q src tests
      - name: Chay kiem thu ngoai tuyen
        env:
          NO_PROXY: "*"
        run: PYTHONPATH=src uv run --python 3.12 python -m unittest discover -s tests -p 'test_*.py' -v
