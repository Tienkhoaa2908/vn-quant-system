name: v78_c3_tactical_terminal

on:
  push:
    branches:
      - agent/v78-c3-tactical-terminal
  pull_request:
    paths:
      - 'src/he_thong_dinh_luong/c3_tactical_terminal_v78.py'
      - 'src/he_thong_dinh_luong/c3_tactical_terminal_v78_driver.py'
      - 'src/he_thong_dinh_luong/web_console_app_v78.py'
      - 'tests/test_c3_tactical_terminal_v78.py'
      - 'tests/test_c3_tactical_terminal_v78_driver.py'
      - 'scripts/run_v78_c3_tactical_terminal_gitbash.sh'
      - '.github/workflows/v78_c3_tactical_terminal.yml'
      - 'tai_lieu_dieu_phoi/v78_*'

jobs:
  linux-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen V78 dependencies
        run: python -m pip install --disable-pip-version-check scikit-learn==1.9.0 nicegui==3.14.0
      - name: Compile V78
        env:
          PYTHONPATH: src
        run: |
          python -m py_compile \
            src/he_thong_dinh_luong/c3_tactical_terminal_v78.py \
            src/he_thong_dinh_luong/c3_tactical_terminal_v78_driver.py \
            src/he_thong_dinh_luong/web_console_app_v78.py \
            tests/test_c3_tactical_terminal_v78.py \
            tests/test_c3_tactical_terminal_v78_driver.py
      - name: Run V78 tactical tests
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_c3_tactical_terminal_v78 tests.test_c3_tactical_terminal_v78_driver -v
      - name: Validate Git Bash runner
        run: bash -n scripts/run_v78_c3_tactical_terminal_gitbash.sh
      - name: Guard operational contracts
        run: |
          grep -q 'OPERATIONAL_CHAMPION = "C3_STABLE_3_PAST_IC_SHRUNK"' src/he_thong_dinh_luong/c3_tactical_terminal_v78.py
          grep -q 'SECONDARY_MODEL = "V76_RIDGE_RANK"' src/he_thong_dinh_luong/c3_tactical_terminal_v78.py
          grep -q 'r07_r08_auto_sell' src/he_thong_dinh_luong/c3_tactical_terminal_v78_driver.py
          grep -q 'prior_month_top10_never_hidden_by_current_eligibility_failure' src/he_thong_dinh_luong/c3_tactical_terminal_v78_driver.py
          grep -q 'set -euo pipefail' scripts/run_v78_c3_tactical_terminal_gitbash.sh
          grep -q 'web_console_app_v78' scripts/run_v78_c3_tactical_terminal_gitbash.sh

  windows-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen V78 dependencies
        run: python -m pip install --disable-pip-version-check scikit-learn==1.9.0 nicegui==3.14.0
      - name: Compile V78 on Windows
        env:
          PYTHONPATH: src
        run: python -m py_compile src/he_thong_dinh_luong/c3_tactical_terminal_v78.py src/he_thong_dinh_luong/c3_tactical_terminal_v78_driver.py src/he_thong_dinh_luong/web_console_app_v78.py tests/test_c3_tactical_terminal_v78.py tests/test_c3_tactical_terminal_v78_driver.py
      - name: Run V78 tactical tests on Windows
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_c3_tactical_terminal_v78 tests.test_c3_tactical_terminal_v78_driver -v
