name: v76_learned_ranking

on:
  push:
    branches:
      - agent/v76-learned-ranking-challenger-lab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical ML dependency
        run: python -m pip install --disable-pip-version-check scikit-learn==1.9.0
      - name: Compile V76
        run: |
          python -m py_compile \
            src/he_thong_dinh_luong/c3_hose_native_driver_v67.py \
            src/he_thong_dinh_luong/c3_hose_consolidated_v68_safe.py \
            src/he_thong_dinh_luong/deep_portfolio_backtest_v70.py \
            src/he_thong_dinh_luong/c3_consolidated_selection_v75.py \
            src/he_thong_dinh_luong/learned_ranking_challenger_v76.py \
            tests/test_learned_ranking_challenger_v76.py
      - name: Run V76 causal and end-to-end tests
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_learned_ranking_challenger_v76 -v
      - name: Validate runner syntax
        run: bash -n scripts/run_v76_learned_ranking_gitbash.sh
      - name: Validate frozen research contracts
        run: |
          set -euo pipefail
          grep -q 'CHAMPION_MODEL = "C3_STABLE_3_PAST_IC_SHRUNK"' src/he_thong_dinh_luong/learned_ranking_challenger_v76.py
          grep -q 'PRIMARY_SELECTION_END = date(2025, 12, 31)' src/he_thong_dinh_luong/learned_ranking_challenger_v76.py
          grep -q 'V76_RIDGE_RANK' src/he_thong_dinh_luong/learned_ranking_challenger_v76.py
          grep -q 'V76_RIDGE_CONTEXT' src/he_thong_dinh_luong/learned_ranking_challenger_v76.py
          grep -q 'V76_HGB_CONTEXT' src/he_thong_dinh_luong/learned_ranking_challenger_v76.py
          grep -q 'V76_LOGIT_BOTTOM20_SAFE' src/he_thong_dinh_luong/learned_ranking_challenger_v76.py
          grep -q 'portfolio_eligibility_used_as_training_filter": False' src/he_thong_dinh_luong/learned_ranking_challenger_v76.py
          grep -q 'row.label_end < test_day' src/he_thong_dinh_luong/learned_ranking_challenger_v76.py
          grep -q 'YEAR_2026_USED_FOR_RESEARCH_SELECTION=false' scripts/run_v76_learned_ranking_gitbash.sh
          grep -q 'REFERENCE_REUSED=true' scripts/run_v76_learned_ranking_gitbash.sh
          grep -q 'CURRENT_STORE_SHA' scripts/run_v76_learned_ranking_gitbash.sh
          grep -q 'STORE_MUTATION_ALLOWED=false' scripts/run_v76_learned_ranking_gitbash.sh
          grep -q 'PROMOTION_AUTHORIZED=false' scripts/run_v76_learned_ranking_gitbash.sh
          if grep -Eiq '(lightgbm|xgboost|place_order|create_order|trading_token|otp)' src/he_thong_dinh_luong/learned_ranking_challenger_v76.py; then
            echo 'V76 must remain sklearn-only research challenger without broker actions' >&2
            exit 1
          fi

  windows-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical ML dependency on Windows
        run: python -m pip install --disable-pip-version-check scikit-learn==1.9.0
      - name: Compile V76 on Windows
        run: python -m py_compile src/he_thong_dinh_luong/deep_portfolio_backtest_v70.py src/he_thong_dinh_luong/c3_consolidated_selection_v75.py src/he_thong_dinh_luong/learned_ranking_challenger_v76.py tests/test_learned_ranking_challenger_v76.py
      - name: Run V76 end-to-end on Windows
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_learned_ranking_challenger_v76 -v