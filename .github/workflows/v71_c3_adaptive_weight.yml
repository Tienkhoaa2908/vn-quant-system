name: v71_c3_adaptive_weight

on:
  push:
    branches:
      - agent/v71-c3-adaptive-weight-ablation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile V71
        run: |
          python -m py_compile \
            src/he_thong_dinh_luong/c3_hose_native_v67.py \
            src/he_thong_dinh_luong/c3_hose_consolidated_v68_safe.py \
            src/he_thong_dinh_luong/deep_portfolio_backtest_v70.py \
            src/he_thong_dinh_luong/c3_adaptive_weight_v71.py \
            src/he_thong_dinh_luong/c3_adaptive_weight_v71_safe.py \
            tests/test_c3_adaptive_weight_v71.py
      - name: Run V71 pure and end-to-end tests
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_c3_adaptive_weight_v71 -v
      - name: Validate runner syntax
        run: bash -n scripts/run_v71_c3_adaptive_weight_gitbash.sh
      - name: Validate frozen C3 and selection contracts
        run: |
          set -euo pipefail
          grep -q 'CHAMPION_MODEL = "C3_STABLE_3_PAST_IC_SHRUNK"' src/he_thong_dinh_luong/c3_adaptive_weight_v71.py
          grep -q 'Candidate("C3_IC_EWMA_HL24", "EWMA", 24)' src/he_thong_dinh_luong/c3_adaptive_weight_v71.py
          grep -q 'Candidate("C3_IC_ROLLING60", "ROLLING", 60)' src/he_thong_dinh_luong/c3_adaptive_weight_v71.py
          grep -q 'PRIMARY_SELECTION_END = date(2025, 12, 31)' src/he_thong_dinh_luong/c3_adaptive_weight_v71.py
          grep -q 'year_2026_used_for_candidate_selection": False' src/he_thong_dinh_luong/c3_adaptive_weight_v71.py
          grep -q 'portfolio_engine_reused": "deep_portfolio_backtest_v70"' src/he_thong_dinh_luong/c3_adaptive_weight_v71.py
          grep -q 'v71_daily_equity_base.csv.gz' src/he_thong_dinh_luong/c3_adaptive_weight_v71.py
          grep -q 'promotion_authorized": False' src/he_thong_dinh_luong/c3_adaptive_weight_v71.py
          grep -q 'V67_FROZEN_TRAINING_ROW' src/he_thong_dinh_luong/c3_adaptive_weight_v71_safe.py
          grep -q 'DIRECT_RAW_STORE_CAUSAL_LATEST' src/he_thong_dinh_luong/c3_adaptive_weight_v71_safe.py
          grep -q 'c3_adaptive_weight_v71_safe' scripts/run_v71_c3_adaptive_weight_gitbash.sh
          grep -q 'PRIMARY_SELECTION_END=2025-12-31' scripts/run_v71_c3_adaptive_weight_gitbash.sh
          grep -q 'YEAR_2026_USED_FOR_SELECTION=false' scripts/run_v71_c3_adaptive_weight_gitbash.sh
          grep -q 'MACRO_INCLUDED=false' scripts/run_v71_c3_adaptive_weight_gitbash.sh
          if grep -Eiq '(sklearn|lightgbm|xgboost|place_order|create_order|trading_token|otp)' src/he_thong_dinh_luong/c3_adaptive_weight_v71.py src/he_thong_dinh_luong/c3_adaptive_weight_v71_safe.py; then
            echo 'V71 must remain frozen-C3 research-only and challenger-ML free' >&2
            exit 1
          fi

  windows-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile V71 on Windows
        run: python -m py_compile src/he_thong_dinh_luong/deep_portfolio_backtest_v70.py src/he_thong_dinh_luong/c3_adaptive_weight_v71.py src/he_thong_dinh_luong/c3_adaptive_weight_v71_safe.py tests/test_c3_adaptive_weight_v71.py
      - name: Run V71 end-to-end on Windows
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_c3_adaptive_weight_v71 -v
