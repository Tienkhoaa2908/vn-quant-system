name: v75_consolidated_selection

on:
  push:
    branches:
      - agent/v75-consolidated-selection-optimization
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile V75
        run: |
          python -m py_compile \
            src/he_thong_dinh_luong/c3_hose_native_v67.py \
            src/he_thong_dinh_luong/c3_hose_consolidated_v68_safe.py \
            src/he_thong_dinh_luong/deep_portfolio_backtest_v70.py \
            src/he_thong_dinh_luong/macro_pit_ablation_v74.py \
            src/he_thong_dinh_luong/c3_consolidated_selection_v75.py \
            tests/test_c3_consolidated_selection_v75.py
      - name: Run V75 pure and end-to-end tests
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_c3_consolidated_selection_v75 -v
      - name: Validate runner syntax
        run: bash -n scripts/run_v75_consolidated_selection_gitbash.sh
      - name: Validate frozen research contracts
        run: |
          set -euo pipefail
          grep -q 'CHAMPION_MODEL = "C3_STABLE_3_PAST_IC_SHRUNK"' src/he_thong_dinh_luong/c3_consolidated_selection_v75.py
          grep -q 'PRIMARY_SELECTION_END = date(2025, 12, 31)' src/he_thong_dinh_luong/c3_consolidated_selection_v75.py
          grep -q 'C3_FAST_REL20_25' src/he_thong_dinh_luong/c3_consolidated_selection_v75.py
          grep -q 'C3_FAST_ACCEL_25' src/he_thong_dinh_luong/c3_consolidated_selection_v75.py
          grep -q 'C3_FRESH_BREAKOUT_25' src/he_thong_dinh_luong/c3_consolidated_selection_v75.py
          grep -q 'C3_AUX_IC36_35' src/he_thong_dinh_luong/c3_consolidated_selection_v75.py
          grep -q 'year_2026_used_for_candidate_selection' src/he_thong_dinh_luong/c3_consolidated_selection_v75.py
          grep -q 'MACRO_LANE=OPTIONAL_NONBLOCKING' scripts/run_v75_consolidated_selection_gitbash.sh
          grep -q 'PROFIT_REPORT_REQUIRED=true' scripts/run_v75_consolidated_selection_gitbash.sh
          grep -q 'STORE_MUTATION_ALLOWED=false' scripts/run_v75_consolidated_selection_gitbash.sh
          grep -q 'PROMOTION_AUTHORIZED=false' scripts/run_v75_consolidated_selection_gitbash.sh
          if grep -Eiq '(place_order|create_order|trading_token|otp|lightgbm|xgboost)' src/he_thong_dinh_luong/c3_consolidated_selection_v75.py; then
            echo 'V75 must remain research-only and broker/model-challenger free' >&2
            exit 1
          fi

  windows-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile V75 on Windows
        run: python -m py_compile src/he_thong_dinh_luong/deep_portfolio_backtest_v70.py src/he_thong_dinh_luong/macro_pit_ablation_v74.py src/he_thong_dinh_luong/c3_consolidated_selection_v75.py tests/test_c3_consolidated_selection_v75.py
      - name: Run V75 end-to-end on Windows
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_c3_consolidated_selection_v75 -v
