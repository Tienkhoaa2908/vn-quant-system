name: ap_dung_payload_m4_reopen

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  ap_dung:
    runs-on: ubuntu-24.04
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4
        with:
          ref: m4-dac_trung-xep_hang-hoc_may
          fetch-depth: 0

      - name: Cai dat uv
        uses: astral-sh/setup-uv@v6

      - name: Ghep va giai nen payload
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import tarfile
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/issues/10/comments?per_page=100"
          request = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(request) as response:
              comments = json.load(response)
          pieces = {}
          for item in comments:
              body = item.get("body") or ""
              if body.startswith("M4PAYLOAD ") and "\n" in body:
                  marker, payload = body.split("\n", 1)
                  pieces[marker.split()[1].split("/", 1)[0]] = payload.strip()
          required = [f"{index:02d}" for index in range(10)] + ["10A", "10B", "11"]
          missing = [key for key in required if key not in pieces]
          if missing:
              raise SystemExit(f"Thieu payload: {missing}")
          raw = base64.b64decode("".join(pieces[key] for key in required), validate=True)
          expected = "5cb27eef06020ff8b12db6d86a53356de1f384fa2367d92cb2ca9965676fafce"
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected:
              raise SystemExit(f"Sai SHA payload: {actual}")
          archive_path = Path("/tmp/m4_patch.tar.gz")
          archive_path.write_bytes(raw)
          root = Path.cwd().resolve()
          with tarfile.open(archive_path, "r:gz") as archive:
              for member in archive.getmembers():
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Duong dan payload khong an toan: {member.name}")
                  destination = (root / Path(*path.parts)).resolve()
                  if root not in destination.parents and destination != root:
                      raise SystemExit(f"Payload thoat khoi repository: {member.name}")
              archive.extractall(root, filter="data")
          PY

      - name: Xoa tep tam
        run: rm -f .github/workflows/ap_dung_payload_m4.yml .github/workflows/ap_dung_payload_m4_reopen.yml .github/payload_trigger.txt

      - name: Dong bo moi truong
        run: uv sync --frozen --python 3.12

      - name: Kiem tra cu phap
        env:
          PYTHONPATH: src
          NO_PROXY: "*"
        run: uv run --python 3.12 python -m compileall -q src tests

      - name: Chay kiem thu ngoai tuyen
        env:
          PYTHONPATH: src
          NO_PROXY: "*"
        run: uv run --python 3.12 python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Commit va push fast-forward
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "hoan thien runner dau cuoi Moc 4"
          git push origin HEAD:m4-dac_trung-xep_hang-hoc_may
