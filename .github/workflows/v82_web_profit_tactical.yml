name: v82_web_profit_tactical

on:
  push:
    branches:
      - agent/v82-web-profit-tactical-dashboard
  pull_request:
    paths:
      - 'src/he_thong_dinh_luong/local_workstation_v82_bridge.py'
      - 'src/he_thong_dinh_luong/existing_web_v82_installer.py'
      - 'web_extensions/v82/**'
      - 'tests/test_local_workstation_v82_bridge.py'
      - 'tests/test_existing_web_v82_installer.py'
      - 'scripts/run_v82_web_profit_tactical_gitbash.sh'
      - '.github/workflows/v82_web_profit_tactical.yml'
      - 'tai_lieu_dieu_phoi/v81_profit_snapshot_20260818.json'

jobs:
  contract:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile V78 V82 bridge and installer
        env:
          PYTHONPATH: src
        run: python -m py_compile src/he_thong_dinh_luong/local_workstation_v78_bridge.py src/he_thong_dinh_luong/local_workstation_v82_bridge.py src/he_thong_dinh_luong/existing_web_v78_installer.py src/he_thong_dinh_luong/existing_web_v82_installer.py tests/test_local_workstation_v82_bridge.py tests/test_existing_web_v82_installer.py
      - name: Run V82 contracts
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_local_workstation_v82_bridge tests.test_existing_web_v82_installer -v
      - name: Guard no live-order surface
        shell: bash
        run: |
          grep -q 'L15_SWAP50_WORST' tai_lieu_dieu_phoi/v81_profit_snapshot_20260818.json
          grep -q 'live_orders_allowed.*false' tai_lieu_dieu_phoi/v81_profit_snapshot_20260818.json
          grep -q '/api/dashboard-v82' src/he_thong_dinh_luong/existing_web_v82_installer.py
          if grep -Eiq 'send_order|place_order|submit_order|broker_order' src/he_thong_dinh_luong/local_workstation_v82_bridge.py src/he_thong_dinh_luong/existing_web_v82_installer.py web_extensions/v82/tactical_profit_v82.js; then exit 1; fi
