name: v60_c3_short_horizon

on:
  push:
    branches:
      - agent/v60-c3-short-horizon-preview-study
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        env:
          PYTHONPATH: src:vn_quant_local_system/src
        run: |
          python -m py_compile src/he_thong_dinh_luong/c3_short_horizon_v60.py
          python -m py_compile tests/test_c3_short_horizon_v60.py
      - name: Pure tests
        env:
          PYTHONPATH: src:vn_quant_local_system/src
        run: python -m unittest tests.test_c3_short_horizon_v60 -v
      - name: Research-only contracts
        run: |
          bash -n scripts/run_v60_c3_short_horizon_gitbash.sh
          grep -q 'NEW_PREVIEW_TOP10' src/he_thong_dinh_luong/c3_short_horizon_v60.py
          grep -q 'CANONICAL_TOP10_DROPPED20' src/he_thong_dinh_luong/c3_short_horizon_v60.py
          grep -q 'WEEK_LAST_CLOSE_TO_NEXT_SESSION_OPEN' src/he_thong_dinh_luong/c3_short_horizon_v60.py
          grep -q '2026, 7, 31' src/he_thong_dinh_luong/c3_short_horizon_v60.py
          grep -q 'live_model_change_authorized' src/he_thong_dinh_luong/c3_short_horizon_v60.py
          if grep -Rqn 'c3_short_horizon_v60' vn_quant_local_system/src/vn_quant_local/__init__.py; then exit 2; fi
