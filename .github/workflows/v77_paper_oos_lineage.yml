name: v77_paper_oos_lineage

on:
  push:
    branches:
      - agent/v77-paper-oos-data-lineage
  pull_request:
    paths:
      - 'src/he_thong_dinh_luong/paper_oos_data_lineage_v77.py'
      - 'src/he_thong_dinh_luong/paper_oos_data_lineage_v77_driver.py'
      - 'tests/test_paper_oos_data_lineage_v77.py'
      - 'tests/test_paper_oos_data_lineage_v77_driver.py'
      - 'tests/test_paper_oos_data_lineage_v77_causal_floor.py'
      - 'scripts/run_v77_paper_oos_lineage_gitbash.sh'
      - '.github/workflows/v77_paper_oos_lineage.yml'
      - 'tai_lieu_dieu_phoi/v77_*'

jobs:
  linux-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install V77 frozen ML dependency
        run: python -m pip install --disable-pip-version-check scikit-learn==1.9.0
      - name: Compile V77
        env:
          PYTHONPATH: src
        run: |
          python -m py_compile \
            src/he_thong_dinh_luong/paper_oos_data_lineage_v77.py \
            src/he_thong_dinh_luong/paper_oos_data_lineage_v77_driver.py \
            tests/test_paper_oos_data_lineage_v77.py \
            tests/test_paper_oos_data_lineage_v77_driver.py \
            tests/test_paper_oos_data_lineage_v77_causal_floor.py
      - name: Run V77 causal and end-to-end tests
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_paper_oos_data_lineage_v77 tests.test_paper_oos_data_lineage_v77_driver tests.test_paper_oos_data_lineage_v77_causal_floor -v
      - name: Validate Git Bash runner syntax
        run: bash -n scripts/run_v77_paper_oos_lineage_gitbash.sh
      - name: Validate frozen safety contracts
        run: |
          grep -Eq 'CHAMPION_MODEL[[:space:]]*=[[:space:]]*"C3_STABLE_3_PAST_IC_SHRUNK"' src/he_thong_dinh_luong/paper_oos_data_lineage_v77.py
          grep -Eq 'SHADOW_MODEL[[:space:]]*=[[:space:]]*"V76_RIDGE_RANK"' src/he_thong_dinh_luong/paper_oos_data_lineage_v77.py
          grep -q 'fresh_oos_only_for_promotion_evidence' src/he_thong_dinh_luong/paper_oos_data_lineage_v77.py
          grep -q 'live_orders_allowed' src/he_thong_dinh_luong/paper_oos_data_lineage_v77.py
          grep -q 'FIRST_MARKET_SESSION_ON_OR_AFTER_CAPTURE_VN_DATE_PLUS_1' src/he_thong_dinh_luong/paper_oos_data_lineage_v77_driver.py
          grep -q 'V77_RETROACTIVE_FILL_DETECTED' src/he_thong_dinh_luong/paper_oos_data_lineage_v77_driver.py
          grep -q 'set -euo pipefail' scripts/run_v77_paper_oos_lineage_gitbash.sh
          grep -q 'vn_quant_local_system/.venv/Scripts/python.exe' scripts/run_v77_paper_oos_lineage_gitbash.sh

  windows-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install V77 frozen ML dependency on Windows
        run: python -m pip install --disable-pip-version-check scikit-learn==1.9.0
      - name: Compile V77 on Windows
        env:
          PYTHONPATH: src
        run: |
          python -m py_compile src/he_thong_dinh_luong/paper_oos_data_lineage_v77.py src/he_thong_dinh_luong/paper_oos_data_lineage_v77_driver.py tests/test_paper_oos_data_lineage_v77.py tests/test_paper_oos_data_lineage_v77_driver.py tests/test_paper_oos_data_lineage_v77_causal_floor.py
      - name: Run V77 end-to-end on Windows
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_paper_oos_data_lineage_v77 tests.test_paper_oos_data_lineage_v77_driver tests.test_paper_oos_data_lineage_v77_causal_floor -v
