name: v62_exposure_bridge

on:
  push:
    branches:
      - agent/v62-exposure-normalized-preview-bridge-study
    paths:
      - "src/he_thong_dinh_luong/c3_exposure_bridge_v62.py"
      - "tests/test_c3_exposure_bridge_v62.py"
      - "scripts/run_v62_exposure_bridge_gitbash.sh"
      - "docs/V62_EXPOSURE_NORMALIZED_PREVIEW_BRIDGE_STUDY.md"
      - ".github/workflows/v62_exposure_bridge.yml"
  pull_request:
    paths:
      - "src/he_thong_dinh_luong/c3_exposure_bridge_v62.py"
      - "tests/test_c3_exposure_bridge_v62.py"
      - "scripts/run_v62_exposure_bridge_gitbash.sh"
      - "docs/V62_EXPOSURE_NORMALIZED_PREVIEW_BRIDGE_STUDY.md"
      - ".github/workflows/v62_exposure_bridge.yml"

jobs:
  pure-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile V62
        run: python -m py_compile src/he_thong_dinh_luong/c3_exposure_bridge_v62.py tests/test_c3_exposure_bridge_v62.py
      - name: Run V62 pure tests
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_c3_exposure_bridge_v62 -v
