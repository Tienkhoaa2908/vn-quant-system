name: v63_weekly_gates

on:
  push:
    branches:
      - agent/v63-weekly-protection-opportunity-gates
    paths:
      - "src/he_thong_dinh_luong/_v63_contract.py"
      - "src/he_thong_dinh_luong/_v63_state.py"
      - "src/he_thong_dinh_luong/_v63_protection.py"
      - "src/he_thong_dinh_luong/_v63_opportunity.py"
      - "src/he_thong_dinh_luong/_v63_engine.py"
      - "src/he_thong_dinh_luong/_v63_reporting.py"
      - "src/he_thong_dinh_luong/c3_weekly_gates_v63.py"
      - "tests/test_c3_weekly_gates_v63.py"
      - "scripts/run_v63_weekly_gates_gitbash.sh"
      - "docs/V63_WEEKLY_PROTECTION_OPPORTUNITY_GATES_STUDY.md"
      - ".github/workflows/v63_weekly_gates.yml"
  pull_request:
    paths:
      - "src/he_thong_dinh_luong/_v63_contract.py"
      - "src/he_thong_dinh_luong/_v63_state.py"
      - "src/he_thong_dinh_luong/_v63_protection.py"
      - "src/he_thong_dinh_luong/_v63_opportunity.py"
      - "src/he_thong_dinh_luong/_v63_engine.py"
      - "src/he_thong_dinh_luong/_v63_reporting.py"
      - "src/he_thong_dinh_luong/c3_weekly_gates_v63.py"
      - "tests/test_c3_weekly_gates_v63.py"
      - "scripts/run_v63_weekly_gates_gitbash.sh"
      - "docs/V63_WEEKLY_PROTECTION_OPPORTUNITY_GATES_STUDY.md"
      - ".github/workflows/v63_weekly_gates.yml"

jobs:
  pure-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile V63
        run: python -m py_compile src/he_thong_dinh_luong/_v63_contract.py src/he_thong_dinh_luong/_v63_state.py src/he_thong_dinh_luong/_v63_protection.py src/he_thong_dinh_luong/_v63_opportunity.py src/he_thong_dinh_luong/_v63_engine.py src/he_thong_dinh_luong/_v63_reporting.py src/he_thong_dinh_luong/c3_weekly_gates_v63.py tests/test_c3_weekly_gates_v63.py
      - name: Run V63 pure tests
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_c3_weekly_gates_v63 -v
      - name: Validate runner syntax
        run: bash -n scripts/run_v63_weekly_gates_gitbash.sh
      - name: Validate research contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PRIMARY_DECISION_SCENARIO = "BASE"' src/he_thong_dinh_luong/_v63_contract.py
          grep -q 'COST_STRESS_IS_VETO = False' src/he_thong_dinh_luong/_v63_contract.py
          grep -q 'TURNOVER_IS_VETO = False' src/he_thong_dinh_luong/_v63_contract.py
          grep -q 'LIVE_MODEL_CHANGE_AUTHORIZED = False' src/he_thong_dinh_luong/_v63_contract.py
          grep -q 'ANALYSIS_END_DEFAULT = date(2026, 7, 31)' src/he_thong_dinh_luong/_v63_contract.py
          grep -q 'PREVIOUS_COMPLETED_WEEKLY_CLOSE_TO_LATER_WEEKLY_OPEN' src/he_thong_dinh_luong/c3_weekly_gates_v63.py
          grep -q 'shadow_used_for_policy_selection": False' src/he_thong_dinh_luong/c3_weekly_gates_v63.py
          grep -q 'PROTECTION_ONLY' src/he_thong_dinh_luong/_v63_contract.py
          grep -q 'FAST_ENTRY_ONLY' src/he_thong_dinh_luong/_v63_contract.py
          grep -q 'CONFIRMED_ENTRY_ONLY' src/he_thong_dinh_luong/_v63_contract.py
          grep -q 'PROTECTION_FAST' src/he_thong_dinh_luong/_v63_contract.py
          grep -q 'PROTECTION_CONFIRMED' src/he_thong_dinh_luong/_v63_contract.py
          if grep -Eiq '(place_order|create_order|trading_token|otp)' src/he_thong_dinh_luong/_v63_*.py src/he_thong_dinh_luong/c3_weekly_gates_v63.py; then
            echo "V63 source must not contain live order-placement APIs" >&2
            exit 1
          fi
