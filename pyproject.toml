[project]
name = "he-thong-dinh-luong"
version = "0.1.0"
description = "Moc 1 du lieu thi truong cho he thong dinh luong co phieu Viet Nam"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scikit-learn==1.9.0",
]

[tool.uv]
package = false
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
